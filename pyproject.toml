[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sr2025-to-tulipa"
version = "0.1.0"
description = "Convert NBNL Scenariorapport 2025 data to Tulipa inputs."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
sr2025-build = "sr2025_to_tulipa.pipeline:main"
sr2025-tyndp-integrate = "sr2025_to_tulipa.tyndp_integration:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]