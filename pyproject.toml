[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sr2025-to-tulipa"
version = "0.1.0"
description = "Convert NBNL Scenariorapport 2025 data to Tulipa inputs."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
sr2025-inventory = "sr2025_to_tulipa.source_validation:main"
sr2025-demand-audit = "sr2025_to_tulipa.demand_audit:main"
sr2025-profile-audit = "sr2025_to_tulipa.profile_audit:main"
sr2025-carrier-profiles = "sr2025_to_tulipa.carrier_profiles:main"
sr2025-capacity-aggregate = "sr2025_to_tulipa.capacity_aggregation:main"
sr2025-electricity-regionalise = "sr2025_to_tulipa.electricity_regionalisation:main"
sr2025-methane-supply-aggregate = "sr2025_to_tulipa.methane_supply_aggregation:main"
sr2025-tulipa-assets = "sr2025_to_tulipa.tulipa_assets:main"
sr2025-tyndp-integrate = "sr2025_to_tulipa.tyndp_integration:main"
sr2025-dashboard = "sr2025_to_tulipa.dashboard:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]